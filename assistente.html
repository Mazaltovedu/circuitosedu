<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface do Tutor - CircuitosEdu</title>
    <style>
        /* CSS: Estilo focado em legibilidade para o seu produto de mestrado */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #fff; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .tutor { align-self: flex-start; background: #e9e9eb; color: #333; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: white; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; margin-left: 5px; border-radius: 50%; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="message tutor">Olá! Sou o tutor de Circuitos CA. Como posso ajudar em seus estudos hoje?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Tire sua dúvida sobre impedância ou fasores..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        /* JavaScript: Lógica de conexão corrigida para evitar DEPLOYMENT_NOT_FOUND */
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatWindow = document.getElementById('chat-window');
            const message = input.value.trim();

            if (!message) return;

            // Exibe a mensagem do aluno no chat
            appendMessage(message, 'user');
            input.value = '';

            // Cria um identificador visual de carregamento
            const loadingId = 'loading-' + Date.now();
            appendMessage('O tutor está analisando sua dúvida...', 'tutor', loadingId);

            try {
                /* IMPORTANTE: Substitua o link abaixo pelo link REAL que está na aba 
                   "Domains" do seu projeto na Vercel.
                */
                const response = await fetch('https://circuitosedu-kappa.vercel.app/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                // Remove o indicador de carregamento
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (data.reply) {
                    appendMessage(data.reply, 'tutor');
                } else {
                    appendMessage('Ocorreu um erro na resposta da IA. Por favor, tente novamente.', 'tutor');
                }
            } catch (error) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                
                appendMessage('Erro de conexão: Verifique se o servidor na Vercel está online.', 'tutor');
                console.error('Erro de fetch:', error);
            }
        }

        function appendMessage(text, side, id = null) {
            const chatWindow = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${side}`;
            if (id) div.id = id;
            
            // Melhora a visualização pedagógica convertendo quebras de linha em <br>
            div.innerHTML = text.replace(/\n/g, '<br>');
            
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKey(e) { 
            if (e.key === 'Enter') sendMessage(); 
        }
    </script>
</body>
</html>
