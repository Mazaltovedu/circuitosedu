<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface do Tutor</title>
    <style>
        /* CSS: Estilo focado em legibilidade para estudantes */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #fff; }
        #chat-window { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 14px; }
        .user { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .tutor { align-self: flex-start; background: #e9e9eb; color: #333; border-bottom-left-radius: 2px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: white; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; margin-left: 5px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="message tutor">Olá! Sou o tutor de Circuitos CA. Como posso te ajudar hoje?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Tire sua dúvida sobre impedância..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        /* JavaScript: Lógica de conexão com o seu backend na Vercel */
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatWindow = document.getElementById('chat-window');
            const message = input.value.trim();

            if (!message) return;

            // Adiciona mensagem do aluno
            appendMessage(message, 'user');
            input.value = '';

            // Adiciona indicador de "Digitando..."
            const loadingId = 'loading-' + Date.now();
            appendMessage('Tutor está analisando...', 'tutor', loadingId);

            try {
                // A URL deve ser o endereço do seu backend na Vercel
                const response = await fetch('https://circuitosedu-kappa.vercel.app/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.reply) {
                    appendMessage(data.reply, 'tutor');
                } else {
                    appendMessage('Erro na resposta. Verifique a API.', 'tutor');
                }
            } catch (error) {
                if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                appendMessage('Erro de conexão com o servidor.', 'tutor');
                console.error('Erro:', error);
            }
        }

        function appendMessage(text, side, id = null) {
            const chatWindow = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${side}`;
            if (id) div.id = id;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
