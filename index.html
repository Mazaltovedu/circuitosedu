<script>
    window.CHATBOT_API_URL = 'https://circuitosedu-kappa.vercel.app/api/chat';

    document.addEventListener('DOMContentLoaded', function() {
        // Captura os elementos com os IDs exatos
        const sendBtn = document.getElementById('send-message');
        const inputField = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        // Função para adicionar mensagens na tela
        function addMessage(sender, text) {
            if (!chatMessages) return;
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            addMessage('user', message);
            inputField.value = '';

            try {
                const response = await fetch(window.CHATBOT_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                if (data.reply) {
                    addMessage('bot', data.reply);
                } else {
                    addMessage('bot', '🔌 O tutor recebeu a mensagem, mas não enviou resposta.');
                }
            } catch (error) {
                addMessage('bot', '🔌 Erro de conexão. Verifique se a Vercel está online.');
                console.error("Erro técnico:", error);
            }
        }

        // VERIFICAÇÃO FINAL
        if (sendBtn && inputField) {
            sendBtn.onclick = sendMessage; // Usando onclick para garantir compatibilidade
            inputField.onkeypress = (e) => {
                if (e.key === 'Enter') sendMessage();
            };
            console.log("✅ CircuitosEdu: Interface conectada com sucesso!");
        } else {
            // Se cair aqui, é porque os IDs no HTML estão errados
            console.error("❌ ERRO: IDs 'send-message' ou 'chat-input' NÃO encontrados no HTML.");
        }
    });
</script>
