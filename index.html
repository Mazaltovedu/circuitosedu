<!-- Localize a linha 22 e as tags de script no final do arquivo -->
<script>
    // URL corrigida para apontar para o seu backend na Vercel
    window.CHATBOT_API_URL = '/api/chat';

    // Função para adicionar mensagens na tela
    function addMessage(sender, text) {
        const chatMessages = document.getElementById('chat-messages');
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
        messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Função principal de envio
    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;

        addMessage('user', message);
        input.value = '';

        try {
            const response = await fetch(window.CHATBOT_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            if (data.reply) {
                addMessage('bot', data.reply);
            } else {
                throw new Error();
            }
        } catch (error) {
            addMessage('bot', '🔌 Erro: Não foi possível conectar ao assistente. Verifique o backend na Vercel.');
        }
    }

    // Evento do botão e tecla Enter
    document.getElementById('send-message').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
