<div class="chat-wrapper" style="max-width: 600px; margin: 20px auto; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; font-family: sans-serif;">
    
    <div style="background: #2c3e50; color: white; padding: 15px; text-align: center; font-weight: bold;">
        Assistente Virtual CircuitosEdu
    </div>

    <div id="chat-messages" style="height: 400px; overflow-y: auto; padding: 15px; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px;">
        <div class="message bot-message" style="background: #e1e1e1; padding: 10px; border-radius: 8px; align-self: flex-start; max-width: 80% ;">
            Olá! Sou o tutor de Circuitos CA. Como posso te ajudar hoje?
        </div>
    </div>

    <div style="display: flex; padding: 10px; border-top: 1px solid #eee; background: white;">
        <input type="text" id="chat-input" placeholder="Ex: O que é impedância?" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none;">
        <button id="send-message" style="margin-left: 10px; padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Enviar
        </button>
    </div>
</div>

<script>
    // URL do seu motor na Vercel validado anteriormente
    window.CHATBOT_API_URL = 'https://circuitosedu-kappa.vercel.app/api/chat';

    document.addEventListener('DOMContentLoaded', function() {
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-message');

        // Função para formatar as mensagens visualmente
        function addMessage(sender, text) {
            if (!chatMessages) return;
            const messageDiv = document.createElement('div');
            
            // Estilo dinâmico baseado no remetente
            const isUser = sender === 'user';
            messageDiv.style.padding = '10px';
            messageDiv.style.borderRadius = '8px';
            messageDiv.style.maxWidth = '80%';
            messageDiv.style.alignSelf = isUser ? 'flex-end' : 'flex-start';
            messageDiv.style.background = isUser ? '#3498db' : '#e1e1e1';
            messageDiv.style.color = isUser ? 'white' : 'black';
            
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            chatInput.value = '';

            try {
                const response = await fetch(window.CHATBOT_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error('Erro no servidor');

                const data = await response.json();
                
                // Exibe a resposta que vem do seu index.py (campo 'reply')
                if (data.reply) {
                    addMessage('bot', data.reply);
                } else {
                    addMessage('bot', '🔌 Tutor: Recebi sua dúvida, mas estou processando a resposta. Tente novamente.');
                }
            } catch (error) {
                addMessage('bot', '🔌 Erro: Não consegui conectar ao motor Gemini na Vercel.');
                console.error("Erro na API:", error);
            }
        }

        // Ativação dos Eventos
        if (sendBtn && chatInput) {
            sendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            console.log("✅ CircuitosEdu: Interface e Scripts sincronizados!");
        }
    });
</script>
